<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本人搭台鐵</title>
<link rel="manifest" href="mrt-tour-manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#5e35b1">
<style>
:root{--bg:#eef3fb;--card:#fff;--ink:#24324a;--dim:#6a7f9a;--acc:#5e35b1;--bd:#c9d8ea;--ok:#2e7d32;--bad:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#121826;--card:#1c2535;--ink:#e6edf7;--dim:#9fb0c8;--bd:#33425c}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#app{width:100%;max-width:480px}
h1{text-align:center;font-size:1.4rem;margin:4px 0 10px}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.wallet{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 14px;margin-bottom:10px;font-weight:700;font-size:.95rem}
button.main{width:100%;padding:14px;margin-top:12px;font-size:1.1rem;font-weight:700;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button.main.alt{background:#00897b}
.rules{font-size:.85rem;line-height:1.9;color:var(--dim);text-align:center}
.collect{text-align:center;font-weight:700;font-size:1rem}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button{flex:1;padding:9px 4px;font-size:.8rem;font-weight:700;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
.hud{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem;margin-bottom:8px}
.ctrl{margin-top:4px}
.ctrl button{width:100%;padding:11px;font-size:.95rem;font-weight:700;border:0;border-radius:10px;color:#fff;background:var(--dim);cursor:pointer}

/* 場景 */
.scene{position:relative;aspect-ratio:1.6/1;border-radius:14px;overflow:hidden;background:linear-gradient(#90caf9,#e3f2fd);border:2px solid var(--bd);margin-bottom:12px;transition:background .6s}
.scene.night{background:linear-gradient(#0b1530,#2b3a6b)}
.stars{position:absolute;inset:0;opacity:0;transition:opacity .6s;z-index:0;pointer-events:none;background:
 radial-gradient(1.5px 1.5px at 8% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 30% 55%,#fff,transparent),
 radial-gradient(2px 2px at 48% 48%,#fff,transparent),radial-gradient(1.5px 1.5px at 62% 52%,#fff,transparent),
 radial-gradient(2px 2px at 75% 45%,#fff,transparent),radial-gradient(1.5px 1.5px at 95% 58%,#fff,transparent),
 radial-gradient(1.5px 1.5px at 20% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 88% 12%,#fff,transparent)}
.moon{position:absolute;left:3%;top:38%;font-size:1.5rem;opacity:0;transition:opacity .6s;z-index:0;pointer-events:none}
.scene.night .stars,.scene.night .moon{opacity:1}
.track{position:absolute;left:0;right:0;bottom:0;height:36%;background:url(track.webp) no-repeat center bottom;background-size:auto 100%;z-index:1}
.tra-sign{position:absolute;top:56.5%;width:8%;aspect-ratio:1;object-fit:contain;transform:translateX(-50%);z-index:3;pointer-events:none}
.st{position:absolute;top:6px;width:22%;transform:translateX(-50%);text-align:center;font-weight:900;font-size:.7rem;line-height:1.3;color:#24324a;z-index:2}
.scene.night .st{color:#e8eefc}
.st small{display:block;font-size:.72rem;min-height:1.2em;font-weight:700;line-height:1.2;color:#c62828}
.scene.night .st small{color:#ffd54f}
.st img,.st-ph{display:block;width:100%;aspect-ratio:2/1;object-fit:cover;border-radius:6px;border:2px solid #fff;box-shadow:0 1px 4px #0003;margin-bottom:2px}
.scene.night .st img{filter:brightness(.8)}
.st.cur img,.st.cur .st-ph{border-color:#ffd54f;box-shadow:0 0 8px #ffd54f}
.st-ph{background:#7a4a24;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem}
.train{position:absolute;bottom:30%;width:24%;transform:translateX(-50%);transition:left 1.3s ease-in-out;text-align:center;line-height:1;z-index:4}
.train img{display:block;width:100%}
.train span{display:block;white-space:nowrap;font-size:1rem;font-weight:900;color:#24324a;text-shadow:0 0 4px #fff,0 0 4px #fff;margin-bottom:2px;min-height:1em}
.scene.night .train img{filter:brightness(.85)}
.cloud{position:absolute;z-index:0;opacity:.96;pointer-events:none}
.cloud img{display:block;width:100%;height:auto}
.scene.night .cloud{filter:brightness(.62)}
@keyframes drift-right{from{left:-15%}to{left:108%}}
@keyframes drift-left{from{left:108%}to{left:-15%}}
.car{position:absolute;bottom:.6%;z-index:3;width:9%;height:5.2%;pointer-events:none}
.car img{display:block;width:100%;height:100%;object-fit:fill}
.car.reverse img{transform:scaleX(-1)}
@keyframes drive-right{from{left:-12%}to{left:108%}}
@keyframes drive-left{from{left:108%}to{left:-12%}}

/* 旅行團 */
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.chip{border:2px solid var(--bd);border-radius:10px;padding:6px 2px;text-align:center;font-size:.72rem;line-height:1.35;background:var(--card);color:var(--dim)}
.chip b{display:block;font-size:.9rem;color:var(--ink)}
.chip.cur{border-color:var(--acc)}
.chip.done{border-color:var(--ok)}
.chip.fail{border-color:var(--bad)}
.prow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700;font-size:.95rem}
.people{font-size:1.3rem;letter-spacing:2px}
.people .gone{opacity:.15;filter:grayscale(1)}
.q{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.target{font-size:1.75rem;font-weight:900;color:var(--acc);line-height:1.35}
.msg{font-size:1rem;color:var(--dim);font-weight:700;min-height:1.4em}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.nb{aspect-ratio:1.2/1;border-radius:12px;border:3px solid transparent;font-size:1.7rem;font-weight:900;color:#fff;cursor:pointer}
.nb:disabled{opacity:.4;cursor:default}
.nb.bad{border-color:var(--bad);animation:sh .3s}
.nb.ok,.nb.ok:disabled{opacity:1;border-color:var(--ok);box-shadow:0 0 0 3px #66bb6a88}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.err{margin-top:10px;font-size:.78rem;color:var(--dim);text-align:center}
.res{text-align:center;line-height:1.9}
.res .t{font-size:1.15rem;font-weight:900}
.res b{font-size:1.9rem;color:var(--acc)}

/* 商店 */
.shopmsg{min-height:1.4em;text-align:center;font-weight:700;color:var(--ok);font-size:.9rem;margin-bottom:4px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--bd)}
.item:last-of-type{border-bottom:0}
.item .ic{font-size:1.8rem;width:2.2rem;text-align:center}
.item .info{flex:1;line-height:1.4}
.item small{display:block;color:var(--dim);font-size:.75rem}
.item button{padding:9px 12px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
.item button:disabled{background:var(--dim);opacity:.5;cursor:not-allowed}
.soon{text-align:center;color:var(--dim);font-size:.8rem;padding-top:8px}

#update-bar{display:none;position:fixed;left:0;right:0;z-index:9999;bottom:env(safe-area-inset-bottom,0px);background:#0a3a1a;border-top:2px solid #00e676;padding:12px 20px;align-items:center;justify-content:space-between;gap:12px;font-size:.9rem;color:#fff}
#update-bar button{padding:8px 20px;background:#00e676;color:#0a2a14;border:none;border-radius:4px;font-weight:900;cursor:pointer}
#version-tag{text-align:right;font-size:.65rem;color:var(--dim);opacity:.6;min-height:1em}
</style></head><body>
<div id="update-bar"><span>發現新版本</span><button id="update-btn">立即更新</button></div>
<div id="app">
<div id="version-tag"></div>
<h1>🚆 日本人搭台鐵</h1>
<div class="wallet"><span>💰 <b id="w-pts">0</b> 點</span><span>🚗 × <b id="w-car">0</b></span><span>☁️ × <b id="w-cloud">0</b></span></div>

<div id="menu">
  <div class="card">
    <div class="rules">全線 4 站：台北 → 板橋 → 桃園 → 豐原（終點）<br>
      前 3 站各有 3 個旅行團（每團 5 人），一團一題猜商<br>
      （給你 a 和 c，猜 2~9 哪個數字乘以 a，會小於 c 又最接近 c，會提示太大或太小）<br>
      答錯 1 次少 1 人，錯到第 4 次這團就放棄（0 人）<br>
      3 團結束，本站錯誤少於 8 次 → 多一個 🎁 獎勵團（+5 人）<br>
      終點站下車人數 = 得分（1 人 1 點），點數可到商店消費</div>
    <button class="main" onclick="startGame()">發車</button>
    <button class="main alt" onclick="openShop()">🛒 商店</button>
  </div>
  <div class="card">
    <div class="collect" id="menu-stats"></div>
    <div class="tools">
      <button onclick="exportSave()">匯出存檔</button>
      <button onclick="$('importFile').click()">匯入存檔</button>
      <button onclick="clearSave()">清除存檔</button>
    </div>
    <input id="importFile" type="file" accept="application/json,.json" class="hidden" onchange="importSave(this)">
  </div>
</div>

<div id="game" class="hidden">
  <div class="hud"><span id="h-st"></span><span id="h-on"></span></div>
  <div id="game-scene"></div>
  <div class="chips" id="chips"></div>
  <div id="qbox" class="card">
    <div class="prow"><span id="gname"></span><span class="people" id="people"></span></div>
    <div class="q"><div class="target" id="target"></div><div class="msg" id="msg"></div></div>
    <div class="grid" id="grid"></div>
    <div class="err" id="errline"></div>
  </div>
  <div id="sumbox" class="card res hidden"></div>
  <div class="ctrl"><button onclick="quit()">放棄，回主選單</button></div>
</div>

<div id="shop" class="hidden">
  <div id="shop-scene"></div>
  <div class="card"><div id="shop-msg" class="shopmsg"></div><div id="shop-items"></div></div>
  <button class="main alt" style="margin-top:0" onclick="show('menu')">回主選單</button>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const COLORS=["#FF8A65","#FFB74D","#7CB342","#29B6F6","#AB47BC","#EC407A","#26A69A","#FBC02D","#78909C"];

/* ===== 可調整的設定 ===== */
// 4 站（最後一站是終點）。終點圖檔 st-daan.webp 不存在時，會自動改用文字站牌。
const STATIONS=[
  {name:'台北',img:'st-zhongshan.webp'},
  {name:'板橋',img:'st-nanjing.webp'},
  {name:'桃園',img:'st-zhongxiao.webp'},
  {name:'豐原',    img:'st-daan.webp'}
];
const PLAY_STATIONS=3;          // 前 3 站玩遊戲
const GROUPS=3, GROUP_SIZE=5;   // 每站 3 團、每團 5 人
const PASS_AT=4;                // 錯到第 4 次，這團放棄
const BONUS_UNDER=8, BONUS_SIZE=5;   // 本站錯誤總數 < 8 → 多一個 5 人的獎勵團
const CAR_BASE=50, CLOUD_BASE=30, STEP=5;  // 價格 = 基本價 + 擁有數 ÷ 5 的商
const SWITCH_COST=20;           // 切換日夜、切換車廂
// 車廂清單：之後設計新車廂，只要在這裡加一筆（圖檔、價格），商店就會自動出現
const TRAINS=[
  {id:'wenhu',name:'山線標準車廂',img:'train.webp',price:0},
  {id:'emu3000',name:'EMU 3000 型自強號車廂',img:'train-emu3000.webp',price:200},
  {id:'puyuma',name:'普悠瑪號車廂',img:'train-puyuma.webp',price:200}
];
const CAR_IMGS=['car1.webp','car2.webp','car3.webp'];
const CLOUD_IMGS=['cloud1.webp','cloud2.webp','cloud3.webp'];
const MAX_CLOUD=24, MAX_CAR=16;   // 畫面上最多同時顯示幾朵雲、幾輛車（擁有數不受限）
const carPrice=n=>CAR_BASE+Math.floor(n/STEP);
const cloudPrice=n=>CLOUD_BASE+Math.floor(n/STEP);

/* ===== 存檔（localStorage，JSON）===== */
const KEY='mrttour-save-v1';
const DEF=()=>({version:1,points:0,cars:0,clouds:0,night:false,trains:[TRAINS[0].id],train:TRAINS[0].id,plays:0,best:0});
function fix(d){
  const o=Object.assign(DEF(),d);
  ['points','cars','clouds','plays','best'].forEach(k=>{o[k]=Math.max(0,Math.floor(+o[k]||0));});
  o.night=!!o.night;
  if(!Array.isArray(o.trains)||!o.trains.length)o.trains=[TRAINS[0].id];
  if(!o.trains.includes(o.train))o.train=o.trains[0];
  return o;
}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&typeof d==='object')return fix(d);}catch(e){}return DEF();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(SAVE));}catch(e){}}
let SAVE=load(), S=null;

/* ===== 場景 ===== */
let scene,trainEl,onEl,trainImg,stEls=[];
const stX=i=>12.5+i*25;
function buildScene(){
  scene=document.createElement('div');scene.className='scene';
  scene.innerHTML='<div class="stars"></div><div class="moon">🌙</div>';
  STATIONS.forEach((s,i)=>{
    const d=document.createElement('div');d.className='st';d.style.left=stX(i)+'%';
    const im=document.createElement('img');im.src=s.img;im.alt=s.name+'站';
    im.onerror=()=>{const p=document.createElement('div');p.className='st-ph';p.textContent='山線';im.replaceWith(p);};
    const sm=document.createElement('small');
    d.append(im,document.createTextNode(s.name+'站'),sm);
    scene.append(d);stEls.push({d,sm});
  });
  const tr=document.createElement('div');tr.className='track';scene.append(tr);
  // 台鐵標誌牌：放在高架橋側面，與列車、橋體分層顯示。
  [28,49,70,90].forEach(x=>{
    const sign=document.createElement('img');
    sign.className='tra-sign';sign.src='tra-sign.svg';sign.alt='台鐵標誌';
    sign.style.left=x+'%';scene.append(sign);
  });
  trainEl=document.createElement('div');trainEl.className='train';
  onEl=document.createElement('span');
  trainImg=document.createElement('img');trainImg.alt='火車車廂';
  trainEl.append(onEl,trainImg);scene.append(trainEl);
  placeTrain(0);applyScene();
}
function mount(id){$(id).append(scene);}
function placeTrain(i){trainEl.style.left=stX(i)+'%';}
function resetLabels(){stEls.forEach(e=>{e.sm.textContent='';e.d.classList.remove('cur');});onEl.textContent='';}

function applyScene(){
  scene.classList.toggle('night',SAVE.night);
  const t=TRAINS.find(x=>x.id===SAVE.train)||TRAINS[0];
  if(trainImg.getAttribute('src')!==t.img)trainImg.src=t.img;
  syncDecor();
}
function mkCloud(i){
  const e=document.createElement('div');e.className='cloud';
  const im=document.createElement('img');im.src=CLOUD_IMGS[i%CLOUD_IMGS.length];im.alt='雲朵';e.append(im);
  e.style.top=(19+((i*17)%26))+'%';   // 19%~44%：在站牌文字下方、高架橋上方的空白天空
  e.style.width=(7+((i*13)%5))+'%';
  const dur=38+((i*17)%28);
  e.style.animationName=i%2?'drift-left':'drift-right';
  e.style.animationTimingFunction='linear';e.style.animationIterationCount='infinite';
  e.style.animationDuration=dur+'s';
  e.style.animationDelay=(-dur*((i*0.173)%1))+'s';
  return e;
}
function mkCar(i){
  const e=document.createElement('div');e.className='car';
  const reverse=i%3!==0 && i%2===1;
  if(reverse)e.classList.add('reverse');
  const im=document.createElement('img');im.src=CAR_IMGS[i%CAR_IMGS.length];im.alt='道路上的汽車';e.append(im);
  e.style.width=(8+((i*7)%3))+'%';
  const dur=11+((i*5)%9);
  e.style.bottom=(0.6+(i%3)*0.4)+'%';
  e.style.animationName=reverse?'drive-left':'drive-right';
  e.style.animationTimingFunction='linear';e.style.animationIterationCount='infinite';
  e.style.animationDuration=dur+'s';
  e.style.animationDelay=(-dur*((i*0.211)%1))+'s';
  return e;
}
function syncDecor(){   // 只補上新增的（或移除多的），不重畫已經在跑的
  const cl=scene.querySelectorAll('.cloud'), cr=scene.querySelectorAll('.car');
  const wc=Math.min(SAVE.clouds,MAX_CLOUD), wr=Math.min(SAVE.cars,MAX_CAR);
  for(let i=cl.length;i<wc;i++)scene.append(mkCloud(i));
  for(let i=cl.length;i>wc;i--)cl[i-1].remove();
  for(let i=cr.length;i<wr;i++)scene.append(mkCar(i));
  for(let i=cr.length;i>wr;i--)cr[i-1].remove();
}

/* ===== 畫面切換 ===== */
function show(name){
  ['menu','game','shop'].forEach(n=>$(n).classList.toggle('hidden',n!==name));
  if(name==='menu')renderMenu();
  updateWallet();
}
function updateWallet(){$('w-pts').textContent=SAVE.points;$('w-car').textContent=SAVE.cars;$('w-cloud').textContent=SAVE.clouds;}
function renderMenu(){$('menu-stats').textContent=`已出發 ${SAVE.plays} 趟　單趟最高 ${SAVE.best} 人`;}
function later(fn,ms){const s=S;setTimeout(()=>{if(S===s)fn();},ms);}

/* ===== 遊戲流程 ===== */
function startGame(){
  S={st:0,onboard:0,gains:[],phase:'q',res:[],g:0,w:0,stWrong:0,bonus:null,q:null};
  show('game');mount('game-scene');resetLabels();placeTrain(0);
  beginStation();
}
function quit(){
  if(S&&S.phase!=='end'&&!confirm('現在離開，這趟的人數不會變成點數，確定嗎？'))return;
  S=null;show('menu');
}
function beginStation(){
  S.g=0;S.stWrong=0;S.res=[];S.bonus=null;
  stEls.forEach((e,i)=>e.d.classList.toggle('cur',i===S.st));
  $('sumbox').classList.add('hidden');$('qbox').classList.remove('hidden');
  updateHud();newGroup();
}
function updateHud(){
  const n=STATIONS[S.st].name;
  $('h-st').textContent=S.st<PLAY_STATIONS?`第 ${S.st+1} 站・${n}`:`終點・${n}`;
  $('h-on').textContent=`車上 ${S.onboard} 人`;
  onEl.textContent=S.onboard+' 人';
}
// 猜商題：系統決定 a（11~99、個位不為 0）與 b（3~8），給玩家 a 和 c（a*b < c < a*(b+1)），玩家猜 b（2~9）
function newQuestion(){
  let a;do{a=11+rnd(89);}while(a%10===0);
  const b=3+rnd(6);
  const c=a*b+1+rnd(a-1);
  return {a,b,c,ans:b};
}
function newGroup(){
  S.w=0;S.phase='q';S.q=newQuestion();
  $('target').textContent=`${S.q.c} 等於 ${S.q.a} 乘以多少，會小於 ${S.q.c} 最接近 ${S.q.c}？`;
  $('msg').textContent='選一個 2~9 的數字';
  $('grid').innerHTML='';
  for(let n=2;n<=9;n++){
    const b=document.createElement('button');
    b.className='nb';b.textContent=n;b.style.background=COLORS[n%COLORS.length];
    b.onclick=()=>pick(b,n);
    $('grid').appendChild(b);
  }
  renderPeople(GROUP_SIZE);renderChips();updErr();
}
function renderPeople(left){
  $('gname').textContent=`第 ${S.g+1} 團・剩 ${left} 人`;
  let h='';
  for(let i=0;i<GROUP_SIZE;i++)h+=i<left?'🧍':'<span class="gone">🧍</span>';
  $('people').innerHTML=h;
}
function renderChips(){
  let h='';
  for(let i=0;i<GROUPS;i++){
    let cls='',body=`${GROUP_SIZE} 人`;
    if(i<S.res.length){const p=S.res[i];cls=p>0?'done':'fail';body=p>0?`✔ ${p} 人`:'✖ 0 人';}
    else if(i===S.g&&S.phase==='q'){cls='cur';body=`${GROUP_SIZE-S.w} 人`;}
    h+=`<div class="chip ${cls}">團 ${i+1}<b>${body}</b></div>`;
  }
  const gc=S.bonus===true?'done':S.bonus===false?'fail':'';
  h+=`<div class="chip ${gc}">🎁 獎勵團<b>${S.bonus===true?'+'+BONUS_SIZE+' 人':S.bonus===false?'✖':'?'}</b></div>`;
  $('chips').innerHTML=h;
}
function updErr(){$('errline').textContent=`本站錯誤 ${S.stWrong} 次（少於 ${BONUS_UNDER} 次 → 多一個 🎁 獎勵團）`;}

function pick(btn,n){
  if(!S||S.phase!=='q')return;
  if(n===S.q.ans){endGroup(GROUP_SIZE-S.w,true);return;}
  S.w++;S.stWrong++;
  btn.classList.add('bad');btn.disabled=true;
  if(S.w>=PASS_AT){endGroup(0,false);return;}
  $('msg').textContent=(n>S.q.ans?'太大了':'太小了')+'，少了一人！';
  renderPeople(GROUP_SIZE-S.w);renderChips();updErr();
}
function endGroup(people,ok){
  S.phase='wait';
  S.res.push(people);S.onboard+=people;
  document.querySelectorAll('#grid button').forEach(b=>{b.disabled=true;if(+b.textContent===S.q.ans)b.classList.add('ok');});
  $('msg').textContent=ok?`✔ 答對了！${people} 人上車`:`✖ 這團放棄了，答案是 ${S.q.ans}`;
  renderPeople(people);renderChips();updErr();updateHud();
  later(()=>{
    if(S.res.length<GROUPS){S.g++;newGroup();}
    else stationDone();
  },ok?900:1700);
}
function stationDone(){
  S.phase='sum';
  S.bonus=S.stWrong<BONUS_UNDER;
  const base=S.res.reduce((a,b)=>a+b,0);
  const gain=base+(S.bonus?BONUS_SIZE:0);
  if(S.bonus)S.onboard+=BONUS_SIZE;
  S.gains.push(gain);
  stEls[S.st].sm.textContent=`+${gain} 人`;
  renderChips();updateHud();
  const last=S.st===PLAY_STATIONS-1;
  $('qbox').classList.add('hidden');
  const sb=$('sumbox');sb.classList.remove('hidden');
  sb.innerHTML=`<div class="t">${STATIONS[S.st].name}站 完成</div>
    <div>本站錯誤 ${S.stWrong} 次　${S.bonus?`（少於 ${BONUS_UNDER} 次 → 🎁 獎勵團 +${BONUS_SIZE} 人）`:`（要少於 ${BONUS_UNDER} 次才有獎勵團）`}</div>
    <div>本站登車 <b>${gain}</b> 人</div>
    <button class="main" id="go">${last?'駛向終點站 →':'發車 →'}</button>`;
  $('go').onclick=depart;
}
function depart(){
  S.phase='move';
  S.st++;
  stEls.forEach(e=>e.d.classList.remove('cur'));
  placeTrain(S.st);updateHud();
  $('sumbox').innerHTML='<div class="t">🚆 列車行駛中…</div>';
  later(()=>{if(S.st<PLAY_STATIONS)beginStation();else finishRun();},1500);
}
function finishRun(){
  S.phase='end';
  const total=S.onboard, rec=total>SAVE.best;
  SAVE.points+=total;SAVE.plays++;if(rec)SAVE.best=total;
  save();updateWallet();
  stEls[S.st].d.classList.add('cur');
  stEls[S.st].sm.textContent=`下車 ${total} 人`;
  $('sumbox').innerHTML=`<div class="t">🎉 抵達 ${STATIONS[S.st].name}站（終點）</div>
    <div>各站登車：${S.gains.join(' ／ ')}</div>
    <div>下車 <b>${total}</b> 人　＝　+${total} 點${rec&&SAVE.plays>1?'　🏆 新紀錄！':''}</div>
    <div>目前共有 ${SAVE.points} 點</div>
    <button class="main" onclick="startGame()">再玩一趟</button>
    <button class="main alt" onclick="openShop()">🛒 去商店</button>
    <button class="main" style="background:var(--dim)" onclick="quit()">回主選單</button>`;
}

/* ===== 商店 ===== */
function openShop(){
  S=null;
  show('shop');mount('shop-scene');resetLabels();placeTrain(0);
  $('shop-msg').textContent='';renderShop();
}
function item(ic,name,sub,label,act,id,can){
  return `<div class="item"><div class="ic">${ic}</div><div class="info"><b>${name}</b><small>${sub}</small></div>
    <button data-act="${act}" data-id="${id}" ${can?'':'disabled'}>${label}</button></div>`;
}
function renderShop(){
  const P=SAVE.points,cp=carPrice(SAVE.cars),kp=cloudPrice(SAVE.clouds);
  let h='';
  h+=item('🚗','汽車',`已擁有 ${SAVE.cars} 輛　每 ${STEP} 輛，價格 +1`,`${cp} 點`,'car','',P>=cp);
  h+=item('☁️','雲朵',`已擁有 ${SAVE.clouds} 朵　每 ${STEP} 朵，價格 +1`,`${kp} 點`,'cloud','',P>=kp);
  h+=item(SAVE.night?'🌙':'☀️','日夜切換',`目前：${SAVE.night?'夜晚':'白天'}`,`切換・${SWITCH_COST} 點`,'night','',P>=SWITCH_COST);
  TRAINS.forEach(t=>{
    const owned=SAVE.trains.includes(t.id),cur=SAVE.train===t.id;
    if(cur)h+=item('🚆',t.name,'使用中','使用中','','',false);
    else if(owned)h+=item('🚆',t.name,'已擁有',`切換・${SWITCH_COST} 點`,'usetrain',t.id,P>=SWITCH_COST);
    else h+=item('🚆',t.name,'新車廂',`購買・${t.price} 點`,'buytrain',t.id,P>=t.price);
  });
  h+='<div class="soon">更多車廂設計中…</div>';
  $('shop-items').innerHTML=h;
}
$('shop-items').onclick=e=>{
  const b=e.target.closest('button[data-act]');
  if(!b||b.disabled||!b.dataset.act)return;
  const act=b.dataset.act,id=b.dataset.id;let msg='';
  if(act==='car'){const p=carPrice(SAVE.cars);if(SAVE.points<p)return;SAVE.points-=p;SAVE.cars++;msg='🚗 買了一輛車！';}
  else if(act==='cloud'){const p=cloudPrice(SAVE.clouds);if(SAVE.points<p)return;SAVE.points-=p;SAVE.clouds++;msg='☁️ 買了一朵雲！';}
  else if(act==='night'){if(SAVE.points<SWITCH_COST)return;SAVE.points-=SWITCH_COST;SAVE.night=!SAVE.night;msg=SAVE.night?'🌙 切換成夜晚':'☀️ 切換成白天';}
  else if(act==='buytrain'){
    const t=TRAINS.find(x=>x.id===id);
    if(!t||SAVE.trains.includes(id)||SAVE.points<t.price)return;
    SAVE.points-=t.price;SAVE.trains.push(id);msg=`🚆 買到「${t.name}」！可以花 ${SWITCH_COST} 點切換`;
  }
  else if(act==='usetrain'){
    if(!SAVE.trains.includes(id)||SAVE.train===id||SAVE.points<SWITCH_COST)return;
    SAVE.points-=SWITCH_COST;SAVE.train=id;msg='🚆 已切換車廂';
  }
  save();applyScene();updateWallet();renderShop();$('shop-msg').textContent=msg;
};

/* ===== 存檔匯出 / 匯入 / 清除 ===== */
function exportSave(){
  const blob=new Blob([JSON.stringify(SAVE,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mrttour-save.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importSave(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d||['points','cars','clouds'].some(k=>!Number.isFinite(d[k])))throw 0;
      if(!confirm('匯入會覆蓋目前的進度，確定嗎？'))return;
      SAVE=fix(d);save();applyScene();updateWallet();renderMenu();
      alert('匯入完成');
    }catch(e){alert('檔案格式不正確');}
    inp.value='';
  };
  rd.readAsText(f);
}
function clearSave(){
  if(!confirm('確定要清除所有進度（點數、車、雲、車廂都會歸零）？建議先匯出備份。'))return;
  SAVE=DEF();save();applyScene();updateWallet();renderMenu();
}

buildScene();updateWallet();renderMenu();

/* ===== PWA 安裝 / 更新（使用者確認後才切換版本） ===== */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('mrt-tour-sw.js').then(reg=>{
      reg.active&&reg.active.postMessage('GET_VERSION');
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        nw&&nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller)$('update-bar').style.display='flex';
        });
      });
      $('update-btn').onclick=()=>{reg.waiting&&reg.waiting.postMessage('SKIP_WAITING');$('update-bar').style.display='none';};
      setInterval(()=>reg.update(),60000);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update();});
    });
    let refreshing=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshing)return;refreshing=true;location.reload();});
    navigator.serviceWorker.addEventListener('message',e=>{
      if(e.data&&e.data.type==='VERSION')$('version-tag').textContent='v'+e.data.version;
    });
  });
}
